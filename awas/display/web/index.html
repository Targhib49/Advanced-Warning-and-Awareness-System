<!doctype html>
<html lang="id" translate="no">
<head>
<meta charset="utf-8">
<!-- A translation bar over a safety display is a distraction, not a feature. -->
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWAS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Barlow+Semi+Condensed:wght@700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root {
    --bg: #0B0D0E; --panel: #15191C; --track: #22292D; --ink: #E8EDEF; --muted: #8E9BA1;
    --green: #38D39B; --amber: #E0A93C; --orange: #F27A3E; --red: #E5483A; --slate: #8A9AA2;
    --display: 'Barlow Semi Condensed', 'Arial Narrow', sans-serif;
    --body: 'Barlow', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: manipulation; }
  #help { position: fixed; left: 12px; bottom: 10px; color: var(--muted); font: 13px var(--mono);
          background: rgba(0,0,0,.7); padding: 6px 10px; border-radius: 6px; display: none; z-index: 5; }

  /* The setup screens share the 1024 x 600 stage of the driving screens. */
  #setup { position: absolute; left: 50%; top: 50%; width: 1024px; height: 600px; box-sizing: border-box;
           transform-origin: center; background: var(--bg); color: var(--ink); font: 500 24px var(--body);
           padding: 40px; display: none; flex-direction: column; overflow: hidden; }
  #setup .band { position: absolute; left: 0; top: 0; right: 0; height: 10px; background: var(--slate); }
  #setup .status { display: flex; justify-content: space-between; font: 500 20px var(--mono); color: var(--muted); }
  #setup h1 { font: 700 76px/1 var(--display); margin: 26px 0 16px; letter-spacing: -0.01em; }
  #setup p { margin: 0 0 14px; color: var(--ink); }
  #setup .muted { color: var(--muted); }
  #setup .err { color: var(--orange); min-height: 30px; }
  #setup .row { display: flex; gap: 16px; margin-top: auto; }
  #setup button { font: 600 26px var(--body); color: var(--ink); background: var(--track); border: 0;
                  border-radius: 14px; padding: 16px 28px; cursor: pointer; }
  #setup button.primary { background: var(--green); color: var(--bg); }
  #setup button:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  #setup input { font: 600 34px var(--body); color: var(--ink); background: var(--panel); border: 2px solid var(--track);
                 border-radius: 14px; padding: 14px 18px; width: 60%; outline: none; }
  #setup input:focus { border-color: var(--green); }
  #setup ul { list-style: none; padding: 0; margin: 0; }
  #setup .drivers { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; overflow-y: auto; max-height: 330px; }
  #setup .driver { display: flex; align-items: center; background: var(--panel); border-radius: 14px; }
  #setup .driver button.pick { flex: 1; text-align: left; background: none; padding: 18px 20px; }
  #setup .driver .chip { display: block; font: 500 16px var(--mono); color: var(--muted); margin-top: 4px; }
  #setup .driver .chip.ready { color: var(--green); }
  #setup .driver button.del { background: none; color: var(--muted); font-size: 22px; padding: 14px 18px; }
  #setup .consent li { margin: 0 0 12px 0; padding-left: 26px; position: relative; font-size: 22px; }
  #setup .consent li::before { content: ""; position: absolute; left: 0; top: 12px; width: 10px; height: 10px;
                               border-radius: 50%; background: var(--green); }
  /* calibration */
  #setup .cal { display: flex; gap: 32px; flex: 1; min-height: 0; margin-top: 20px; }
  #setup .cam { position: relative; width: 560px; height: 420px; background: #000; border-radius: 14px; overflow: hidden; }
  #setup .cam img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #setup .cam .live { position: absolute; left: 14px; top: 12px; font: 500 16px var(--mono); color: #fff;
                      background: rgba(229,72,58,.85); padding: 4px 10px; border-radius: 6px; }
  #setup .cam .none { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                      color: var(--orange); font: 600 26px var(--body); text-align: center; padding: 30px; }
  #setup .side { flex: 1; display: flex; flex-direction: column; }
  #setup .step { font: 500 18px var(--mono); color: var(--muted); letter-spacing: .08em; }
  #setup .say { font: 600 32px/1.2 var(--body); margin: 10px 0 18px; }
  #setup .checks li { font: 500 21px var(--body); margin-bottom: 8px; color: var(--muted); }
  #setup .checks li.ok { color: var(--green); }
  #setup .bar { height: 14px; background: var(--track); border-radius: 7px; margin: 14px 0 10px; overflow: hidden; }
  #setup .bar > div { height: 100%; background: var(--green); width: 0; transition: width .2s; }
  #setup .stats { font: 500 18px var(--mono); color: var(--muted); }
  #switch { position: fixed; right: 18px; bottom: 16px; font: 600 18px var(--body); color: var(--ink);
            background: rgba(34,41,45,.92); border: 0; border-radius: 10px; padding: 10px 16px; display: none; z-index: 4; }
  /* Demo sound (--browser-audio): shown only when the device offers it. */
  #sound { position: fixed; right: 14px; top: 12px; font: 500 15px var(--mono); color: var(--muted);
           background: rgba(34,41,45,.92); border: 0; border-radius: 8px; padding: 7px 12px; display: none; z-index: 6; }
  #sound.off { color: var(--ink); background: rgba(224,169,60,.9); color: #111; }
  /* --sim with no bridge feeding it: say so, or a demo runs on a fake speed. */
  #game { position: fixed; left: 14px; top: 12px; font: 500 15px var(--mono); color: #111;
          background: rgba(224,169,60,.9); border-radius: 8px; padding: 7px 12px; display: none; z-index: 6; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="setup"></div>
<button id="switch"></button>
<button id="sound"></button>
<div id="game"></div>
<div id="help">[ ] speed &nbsp; i ignition / park &nbsp; 1-9 KSS (parked) &nbsp; d switch driver (parked) &nbsp; l language &nbsp; f full screen &nbsp; s sound &nbsp; ? hide</div>
<script type="module">
import { drawScreen, kssButtonAt, TEXT, W, H } from "/app-screens.js";

const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
const setupEl = document.getElementById("setup");
const switchBtn = document.getElementById("switch");
const params = new URLSearchParams(location.search);
let lang = params.get("lang") === "en" ? "en" : "id";
let snap = null, lastOk = 0, scale = 1;

// Strings the live app adds on top of the design's own TEXT table.
const L10N = {
  id: {
    kmh: v => `${v} km/jam`,
    lane: ok => ok ? "lajur aman" : "lajur —",
    work: w => w == null ? "beban —" : `beban ${w.toFixed(2).replace(".", ",")}`,
    km: v => `${String(v).replace(".", ",")} km`,
    held: r => `Peringatan ditahan: ${r}.`,
    critLine: n => n > 0 ? "Mikrotidur terdeteksi" : "Mata tertutup terlalu lama",
    critSub: "Menepi di tempat aman sekarang.",
    calib: p => `Mengemudi seperti biasa. Mempelajari mata Anda (${Math.round(p * 100)}%).`,
    weave: (sdlp, base) => base == null
      ? `Oleng ${cm(sdlp)} cm (SDLP ${sdlp.toFixed(2).replace(".", ",")} m), belum ada patokan pribadi`
      : `Oleng ${cm(sdlp - base)} cm lebih dari biasanya (SDLP ${sdlp.toFixed(2).replace(".", ",")} m)`,
    worst: "terparah", lost: "Tidak terhubung ke AWAS", switchDriver: "Ganti pengemudi",
  },
  en: {
    kmh: v => `${v} km/h`,
    lane: ok => ok ? "lane ok" : "lane —",
    work: w => w == null ? "workload —" : `workload ${w.toFixed(2)}`,
    km: v => `${v} km`,
    held: r => `Holding back: ${r}.`,
    critLine: n => n > 0 ? "Microsleep detected" : "Eyes closed too long",
    critSub: "Pull over somewhere safe now.",
    calib: p => `Drive as usual. Learning your eyes (${Math.round(p * 100)}%).`,
    weave: (sdlp, base) => base == null
      ? `Weaving ${cm(sdlp)} cm (SDLP ${sdlp.toFixed(2)} m), no personal baseline yet`
      : `Weaving ${cm(sdlp - base)} cm more than your usual (SDLP ${sdlp.toFixed(2)} m)`,
    worst: "worst", lost: "No connection to AWAS", switchDriver: "Switch driver",
  },
};
const cm = m => Math.max(0, Math.round(m * 100));

// The screens before driving (awas/runtime/setup_flow.py).
const SETUP = {
  id: {
    status: "AWAS · PENGATURAN", noCamera: "Kamera tidak terhubung. Periksa kabelnya.",
    gameOff: "⚠ Tidak ada data game — jalankan AWAS bridge di laptop",
    select: "Siapa yang mengemudi?", none: "Belum ada pengemudi terdaftar.",
    ready: "siap", needsCal: "perlu kalibrasi", newDriver: "+ Pengemudi baru",
    confirmDelete: n => `Hapus ${n} beserta profil mata dan semua catatan perjalanannya?`,
    newTitle: "Pengemudi baru", namePrompt: "Nama Anda", next: "Lanjut", back: "Kembali",
    consentTitle: "Persetujuan",
    consent: [
      "Kamera melihat wajah Anda untuk mendeteksi kantuk. Gambar diproses di perangkat ini dan tidak disimpan.",
      "Selama kalibrasi, gambar kamera ditampilkan di layar ini agar Anda bisa mengatur posisi. Setelah itu tidak lagi.",
      "Yang disimpan: nama Anda, ukuran mata pribadi (angka, bukan gambar), dan catatan perjalanan.",
      "Anda bisa menghapus semua data Anda kapan saja dari layar “Siapa yang mengemudi?”.",
    ],
    agree: "Setuju", disagree: "Tidak setuju",
    camLive: "● KAMERA AKTIF", cancel: "Batal",
    steps: { position: "1 · POSISI", open: "2 · MATA TERBUKA", closed: "3 · MATA TERTUTUP",
             down: "4 · LIHAT KE BAWAH", nod: "5 · KEPALA TERKULAI" },
    say: {
      position: "Duduk seperti saat mengemudi. Masukkan wajah ke dalam oval.",
      open: "Lihat ke jalan di depan, seperti saat mengemudi. Berkedip seperti biasa.",
      closed: "Pejamkan mata sampai terdengar bunyi, lalu buka.",
      down: "Lihat ke pangkuan Anda, mata terbuka, sampai terdengar bunyi.",
      nod: "Biarkan kepala terkulai dan pejamkan mata, sampai terdengar bunyi.",
      closing: "Bagus, tahan sebentar…", paused: "Hadap kembali ke kamera.",
    },
    checks: { face: "Wajah terlihat", distance: "Cukup dekat", facing: "Menghadap ke depan", light: "Cahaya cukup" },
    round: (n, of) => `Putaran ${Math.min(n + 1, of)} dari ${of}`,
    hello: n => `Halo, ${n}`, start: "Mulai mengemudi", recal: "Kalibrasi ulang", notMe: "Bukan saya",
    signal: s => ({ cnn: "Sinyal mata: model CNN (terlatih)", ear: "Sinyal mata: EAR (rasio mata)",
                    both: "Sinyal mata: CNN + EAR (keduanya)" })[s] ?? "",
    voice: {
      position: "Duduk seperti saat mengemudi, dengan wajah di dalam oval.",
      open: "Lihat ke jalan di depan. Berkedip seperti biasa.",
      closed: "Pejamkan mata sampai terdengar bunyi.",
      reopen: "Buka mata.", again: "Sekali lagi. Pejamkan mata sampai terdengar bunyi.",
      down: "Sekarang lihat ke pangkuan Anda, mata tetap terbuka, sampai terdengar bunyi.",
      nod: "Sekarang biarkan kepala terkulai dan pejamkan mata, sampai terdengar bunyi.",
      done: "Buka mata. Kalibrasi selesai.", failed: "Buka mata. Kalibrasi belum berhasil.",
    },
    voiceLang: "id-ID",
    doneTitle: "Kalibrasi selesai", failTitle: "Kalibrasi belum berhasil", retry: "Coba lagi",
  },
  en: {
    status: "AWAS · SETUP", noCamera: "Camera not connected. Check the cable.",
    gameOff: "⚠ No game data — start the AWAS bridge on the laptop",
    select: "Who's driving?", none: "No drivers registered yet.",
    ready: "ready", needsCal: "needs calibration", newDriver: "+ New driver",
    confirmDelete: n => `Delete ${n}, their eye profile and all their trip logs?`,
    newTitle: "New driver", namePrompt: "Your name", next: "Next", back: "Back",
    consentTitle: "Consent",
    consent: [
      "The camera watches your face to detect drowsiness. Images are processed on this device and never stored.",
      "During calibration the camera image is shown on this screen so you can get into position. Not after.",
      "What is kept: your name, your personal eye scale (numbers, not images), and your trip logs.",
      "You can delete all of it at any time from the “Who's driving?” screen.",
    ],
    agree: "I agree", disagree: "I don't agree",
    camLive: "● CAMERA ON", cancel: "Cancel",
    steps: { position: "1 · POSITION", open: "2 · EYES OPEN", closed: "3 · EYES CLOSED",
             down: "4 · LOOK DOWN", nod: "5 · HEAD DROP" },
    say: {
      position: "Sit as you would to drive. Get your face inside the oval.",
      open: "Look at the road ahead, as you do when driving. Blink as usual.",
      closed: "Close your eyes until you hear the beep, then open them.",
      down: "Look down at your lap, eyes open, until the beep.",
      nod: "Let your head drop and close your eyes, until the beep.",
      closing: "Good, hold it…", paused: "Face the camera again.",
    },
    checks: { face: "Face visible", distance: "Close enough", facing: "Facing forward", light: "Enough light" },
    round: (n, of) => `Round ${Math.min(n + 1, of)} of ${of}`,
    hello: n => `Hello, ${n}`, start: "Start driving", recal: "Calibrate again", notMe: "Not me",
    signal: s => ({ cnn: "Eye signal: CNN model (learned)", ear: "Eye signal: EAR (eye ratio)",
                    both: "Eye signal: CNN + EAR (both)" })[s] ?? "",
    voice: {
      position: "Sit as you do to drive, with your face in the oval.",
      open: "Look at the road ahead. Blink as usual.",
      closed: "Close your eyes until you hear the beep.",
      reopen: "Open your eyes.", again: "Once more. Close your eyes until the beep.",
      down: "Now look down at your lap, eyes open, until the beep.",
      nod: "Now let your head drop and close your eyes, until the beep.",
      done: "Open your eyes. Calibration done.", failed: "Open your eyes. Calibration didn't work.",
    },
    voiceLang: "en-US",
    doneTitle: "Calibration done", failTitle: "Calibration didn't work", retry: "Try again",
  },
};

// ---------------------------------------------------------------- driving screens

function liveFor(s) {
  const X = L10N[lang], T = TEXT[lang];
  const foot = [X.kmh(s.speed_kmh), X.lane(s.lane), X.work(s.workload)];
  const live = { clock: s.clock, channel: s.lane ? undefined : T.faceOnly, text: { foot } };
  switch (s.screen) {
    case "critical":
      live.text = { line: X.critLine(s.microsleeps), sub: X.critSub, foot: [X.kmh(s.speed_kmh)] };
      break;
    case "gate": {
      // The gate holds the alert back; it does not change how drowsy you are.
      const own = ["monitoring", "tired", "engaging", "insist"][Math.min(s.level, 3)];
      Object.assign(live, { level: s.level });
      Object.assign(live.text, { word: T[own].word, line: X.held(s.held_reason) });
      break;
    }
    case "nocamera":
      // Say which channel, if any, is still watching.
      live.channel = s.lane ? T.channels[1] : T.noChannel;
      if (s.lane) live.text.note = lang === "id"
        ? "Periksa kabel kamera. Lajur tetap dipantau."
        : "Check the camera cable. The lane is still monitored.";
      break;
    case "occluded":
      // Lane only: the face is gone, the vehicle channel carries on, capped.
      Object.assign(live, { level: s.level, channel: undefined });
      if (s.sdlp_m != null) live.text.note = X.weave(s.sdlp_m, s.sdlp_baseline_m);
      break;
    case "calibrating":
      live.progress = s.calibration_progress;
      live.text.line = X.calib(s.calibration_progress);
      break;
    case "parked": {
      const tr = s.trip;
      live.text = { stats: [[`${tr.driving_min}:${String(tr.driving_sec).padStart(2, "0")}`, T.parked.stats[0][1]],
                            [X.km(tr.distance_km), T.parked.stats[1][1]],
                            [String(tr.nudges), T.parked.stats[2][1]]],
                    worst: X.worst };
      Object.assign(live, { chart: tr.chart, worst: tr.worst, chartStart: tr.start, chartEnd: tr.end, kss: s.kss });
      break;
    }
  }
  return live;
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  scale = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width = `${W * scale}px`;
  canvas.style.height = `${H * scale}px`;
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  setupEl.style.transform = `translate(-50%, -50%) scale(${scale})`;
  render();
}

function render() {
  const linkUp = snap && Date.now() - lastOk <= 2500;
  const inSetup = linkUp && snap.mode === "setup";
  setupEl.style.display = inSetup ? "flex" : "none";
  canvas.style.display = inSetup ? "none" : "block";
  switchBtn.style.display = linkUp && !inSetup && snap.screen === "parked" && snap.can_switch_driver ? "block" : "none";
  switchBtn.textContent = L10N[lang].switchDriver;
  const gameEl = document.getElementById("game");
  gameEl.style.display = linkUp && snap.game === "off" ? "block" : "none";
  gameEl.textContent = SETUP[lang].gameOff;
  if (inSetup) { renderSetup(snap); return; }
  setupSig = "";            // rebuild the setup screen next time it appears
  stopCamera();
  ctx.clearRect(0, 0, W, H);
  if (!linkUp) {
    // Losing the link is a degradation-ladder row, not a failure (plan §7.5).
    ctx.fillStyle = "#0B0D0E"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#8E9BA1"; ctx.font = "500 28px 'IBM Plex Mono', monospace"; ctx.textAlign = "center";
    ctx.fillText(L10N[lang].lost, W / 2, H / 2);
    return;
  }
  drawScreen(ctx, snap.screen, lang, liveFor(snap));
}

// ---------------------------------------------------------------- setup screens

let setupSig = "";

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "onclick") e.addEventListener("click", v);
    else if (k === "class") e.className = v;
    else e.setAttribute(k, v);
  }
  for (const k of kids) e.append(k);          // strings become text nodes: names are never parsed as HTML
  return e;
}

function stopCamera() {
  const img = setupEl.querySelector(".cam img");
  if (img) img.removeAttribute("src");        // closes the stream
}

function renderSetup(s) {
  const S = SETUP[lang];
  // Rebuild only when the screen itself changes, so typing and focus survive
  // the 200 ms polling; calibration progress is updated in place below.
  const sig = JSON.stringify([s.screen, lang, s.error, s.drivers, s.driver, s.result, s.camera_ok]);
  if (sig !== setupSig) {
    setupSig = sig;
    stopCamera();
    setupEl.replaceChildren(...buildSetup(s, S));
    setupEl.querySelector("input, button.primary")?.focus();
  }
  if (s.screen === "calibrating") updateCalibration(s, S);
  speakCalibration(s, S);
}

function buildSetup(s, S) {
  const head = [el("div", { class: "band" }),
                el("div", { class: "status" }, el("span", {}, S.status), el("span", {}, s.driver?.name ?? ""))];
  const err = el("div", { class: "err" }, s.error || (s.camera_ok === false && s.screen !== "calibrating" ? S.noCamera : ""));
  switch (s.screen) {
    case "select": {
      const list = s.drivers?.length
        ? el("ul", { class: "drivers" }, ...s.drivers.map(d => el("li", { class: "driver" },
            el("button", { class: "pick", onclick: () => send({ select_driver: d.id }) },
               d.name, el("span", { class: d.calibrated ? "chip ready" : "chip" }, d.calibrated ? S.ready : S.needsCal)),
            el("button", { class: "del", "aria-label": "delete", onclick: () => {
              if (confirm(S.confirmDelete(d.name))) send({ delete_driver: d.id });
            } }, "✕"))))
        : el("p", { class: "muted" }, S.none);
      return [...head, el("h1", {}, S.select), list, err,
              el("div", { class: "row" }, el("button", { class: "primary", onclick: () => send({ new_driver: true }) }, S.newDriver))];
    }
    case "new": {
      const input = el("input", { maxlength: "24", placeholder: S.namePrompt, autocomplete: "off", spellcheck: "false" });
      const submit = () => send({ name: input.value });
      input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); else if (e.key === "Escape") send({ back: true }); });
      return [...head, el("h1", {}, S.newTitle), input, el("div", { class: "err" }, s.error || ""),
              el("div", { class: "row" }, el("button", { class: "primary", onclick: submit }, S.next),
                                          el("button", { onclick: () => send({ back: true }) }, S.back))];
    }
    case "consent":
      return [...head, el("h1", {}, S.consentTitle),
              el("ul", { class: "consent" }, ...S.consent.map(t => el("li", {}, t))),
              el("div", { class: "row" }, el("button", { class: "primary", onclick: () => send({ consent: true }) }, S.agree),
                                          el("button", { onclick: () => send({ consent: false }) }, S.disagree))];
    case "ready":
      return [...head, el("h1", {}, S.hello(s.driver.name)), el("p", { class: "muted" }, S.signal(s.driver.eye_signal)), err,
              el("div", { class: "row" }, el("button", { class: "primary", onclick: () => send({ start: true }) }, S.start),
                                          el("button", { onclick: () => send({ calibrate: true }) }, S.recal),
                                          el("button", { onclick: () => send({ back: true }) }, S.notMe))];
    case "calibrating": {
      const cam = el("div", { class: "cam" });
      if (s.camera_ok === false) cam.append(el("div", { class: "none" }, S.noCamera));
      else cam.append(el("img", { src: "/camera.mjpg", alt: "" }), el("span", { class: "live" }, S.camLive));
      const checks = el("ul", { class: "checks" }, ...Object.keys(S.checks).map(k => el("li", { "data-k": k }, S.checks[k])));
      const side = el("div", { class: "side" },
        el("div", { class: "step" }), el("div", { class: "say" }), checks,
        el("div", { class: "bar" }, el("div")), el("div", { class: "stats" }),
        el("div", { class: "row" }, el("button", { onclick: () => send({ back: true }) }, S.cancel)));
      return [...head, el("div", { class: "cal" }, cam, side)];
    }
    case "result": {
      const r = s.result || {};
      const pct = v => v == null ? "—" : `${Math.round(v * 100)}%`;
      const order = ["ear", "cnn", "both"].filter(k => r.scores?.[k]);
      const scores = order.map(k => `${k.toUpperCase()}${k === r.eye_signal ? " ✓" : ""} ${pct(r.scores[k].score)}`).join("  ·  ");
      const detail = r.ok ? scores : [r.reason, scores].filter(Boolean).join("  —  ");
      return [...head, el("h1", {}, r.ok ? S.doneTitle : S.failTitle),
              el("p", {}, r.ok ? S.signal(r.eye_signal) : ""), el("p", { class: "muted" }, detail), err,
              el("div", { class: "row" },
                 r.ok ? el("button", { class: "primary", onclick: () => send({ start: true }) }, S.start)
                      : el("button", { class: "primary", onclick: () => send({ calibrate: true }) }, S.retry),
                 r.ok ? el("button", { onclick: () => send({ calibrate: true }) }, S.recal)
                      : el("button", { onclick: () => send({ back: true }) }, S.back))];
    }
  }
  return head;
}

// ---------------------------------------------------------------- spoken cues
// A driver with their eyes closed cannot read the screen, and the device may
// have no speaker, so the page that shows the calibration also speaks it
// through whatever is displaying it. Instructions only — never an alert: the
// safety path stays on the device (plan §7.5).
let cue = { step: null, rounds: 0, toldOpen: false, result: false };
let audioCtx = null;

function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    o.start(t); o.stop(t + 0.4);
  } catch (_) { /* no audio here: the on-screen text still says it */ }
}

function say(text, S) {
  if (!("speechSynthesis" in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = S.voiceLang;
  const v = speechSynthesis.getVoices().find(x => x.lang?.replace("_", "-").startsWith(S.voiceLang.slice(0, 2)));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

function speakCalibration(s, S) {
  const c = s.calibration, V = S.voice;
  if (s.screen !== "calibrating" && s.screen !== "result") {
    cue = { step: null, rounds: 0, toldOpen: false, result: false };   // a fresh run speaks from the start
    return;
  }
  if (s.screen === "result" && !cue.result) {
    cue.result = true;
    beep();                                        // ends the last timed step
    setTimeout(() => say(s.result?.ok ? V.done : V.failed, S), 400);
    return;
  }
  if (s.screen !== "calibrating" || !c) return;
  cue.result = false;
  if (c.step !== cue.step) {                       // a new step: say what to do
    const prev = cue.step;
    cue = { step: c.step, rounds: c.rounds, toldOpen: false, result: false };
    if (prev === "down") { beep(); setTimeout(() => say(V[c.step], S), 400); }   // a beep ends a timed step
    else if (prev === "closed") setTimeout(() => say(V[c.step], S), 1000);        // let "open your eyes" finish
    else say(V[c.step], S);
    return;
  }
  if (c.step !== "closed") return;
  if (c.closing && !cue.toldOpen && c.closed_for >= c.min_closed_sec + 0.8) {
    cue.toldOpen = true;                           // seen enough: tell them to open
    beep();
    setTimeout(() => say(V.reopen, S), 400);
  }
  if (c.rounds > cue.rounds) {                     // a round was counted
    cue.rounds = c.rounds; cue.toldOpen = false;
    if (c.rounds < c.rounds_needed) setTimeout(() => say(V.again, S), 1500);
  }
}

function updateCalibration(s, S) {
  const c = s.calibration;
  if (!c) return;
  setupEl.querySelector(".step").textContent = S.steps[c.step] ?? "";
  setupEl.querySelector(".say").textContent =
    c.paused ? S.say.paused : c.closing ? S.say.closing : (S.say[c.step] ?? "");
  for (const li of setupEl.querySelectorAll(".checks li")) li.classList.toggle("ok", !!c.checks[li.dataset.k]);
  setupEl.querySelector(".bar > div").style.width = `${Math.round(c.progress * 100)}%`;
  setupEl.querySelector(".stats").textContent = c.step === "closed" ? S.round(c.rounds, c.rounds_needed) : "";
}

// ---------------------------------------------------------------- demo sound
// With --browser-audio the device hands this page what it decided to say, as
// clip ids from its own pre-rendered bank: the page is a loudspeaker for a
// prototype with no speaker, nothing more. It decides nothing, and it plays
// only the newest utterance, never a backlog. Browsers allow sound only after
// a click on the page, hence the button.
const soundBtn = document.getElementById("sound");
let soundSeq = null, soundOn = false, soundSrc = null;
const clipBuffers = new Map();

function showSound(offered) {
  soundBtn.style.display = offered ? "block" : "none";
  soundBtn.classList.toggle("off", !soundOn);
  soundBtn.textContent = soundOn ? "🔊 sound on" : "🔇 click for sound";
}

function toggleSound() {
  soundOn = !soundOn;
  if (soundOn) {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume();
  } else if (soundSrc) { try { soundSrc.stop(); } catch (_) {} soundSrc = null; }
  showSound(true);
}

async function clipBuffer(id) {
  if (!clipBuffers.has(id)) {
    const r = await fetch(`/phrases/${id}.wav`);
    clipBuffers.set(id, await audioCtx.decodeAudioData(await r.arrayBuffer()));
  }
  return clipBuffers.get(id);
}

async function playSound() {
  const r = await fetch("/sound", { cache: "no-store" });
  if (!r.ok) return;
  const { seq, clips } = await r.json();
  if (seq < soundSeq) return;
  soundSeq = seq;
  if (!soundOn || !clips.length) return;
  const buffers = await Promise.all(clips.map(clipBuffer));
  if (seq < soundSeq) return;                           // something newer arrived meanwhile
  if (soundSrc) { try { soundSrc.stop(); } catch (_) {} }  // the device chose to interrupt it
  speechSynthesis?.cancel();
  let at = audioCtx.currentTime + 0.02;
  for (const b of buffers) {
    const src = audioCtx.createBufferSource();
    src.buffer = b; src.connect(audioCtx.destination); src.start(at);
    at += b.duration; soundSrc = src;
  }
}

function onSoundHeader(v) {
  showSound(v !== null);
  if (v === null) return;
  const seq = Number(v);
  // Just opened, or the device restarted and counts from 0 again: nothing to
  // replay, only to catch up with.
  if (soundSeq === null || seq < soundSeq) { soundSeq = seq; return; }
  if (seq > soundSeq) { soundSeq = seq; playSound().catch(() => {}); }
}

soundBtn.addEventListener("click", toggleSound);

// ---------------------------------------------------------------- plumbing

let sized = "", uiVersion = null;
async function poll() {
  // A kiosk window can reach full screen without a resize event; check every tick.
  const now = `${innerWidth}x${innerHeight}@${window.devicePixelRatio}`;
  if (now !== sized) { sized = now; resize(); }
  try {
    const r = await fetch("/state", { cache: "no-store" });
    // The device was updated while this page was open: load the new page
    // rather than draw new screens with old code (a kiosk is never reloaded
    // by hand).
    const v = r.headers.get("X-AWAS-UI");
    if (v && uiVersion && v !== uiVersion) { location.reload(); return; }
    uiVersion = v || uiVersion;
    onSoundHeader(r.headers.get("X-AWAS-Sound"));
    if (r.ok) { const s = await r.json(); if (s.screen) { snap = s; lastOk = Date.now(); } }
  } catch (_) { /* the device may be restarting */ }
  render();
}

function send(cmd) {
  fetch("/command", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cmd) })
    .then(() => setTimeout(poll, 60));
}

canvas.addEventListener("click", e => {
  if (snap?.screen !== "parked") return;
  const r = canvas.getBoundingClientRect();
  const k = kssButtonAt((e.clientX - r.left) / scale, (e.clientY - r.top) / scale);
  if (k) send({ kss: k });
});
switchBtn.addEventListener("click", () => send({ switch_driver: true }));

addEventListener("keydown", e => {
  if (e.target instanceof HTMLInputElement) return;        // typing a name is not a shortcut
  const help = document.getElementById("help");
  const driving = snap && snap.mode !== "setup";
  if (driving && e.key === "[") send({ speed_delta: -10 });
  else if (driving && e.key === "]") send({ speed_delta: 10 });
  else if (driving && e.key === "i") send({ ignition: "toggle" });
  else if (driving && /^[1-9]$/.test(e.key) && snap.screen === "parked") send({ kss: Number(e.key) });
  else if (driving && e.key === "d" && snap.screen === "parked" && snap.can_switch_driver) send({ switch_driver: true });
  else if (e.key === "l") { lang = lang === "id" ? "en" : "id"; setupSig = ""; render(); }
  else if (e.key === "f") document.documentElement.requestFullscreen?.();
  else if (e.key === "s" && soundBtn.style.display === "block") toggleSound();
  else if (e.key === "?") help.style.display = help.style.display === "block" ? "none" : "block";
});

addEventListener("resize", resize);
document.fonts?.ready.then(render);
resize();
setInterval(poll, 200);
poll();
</script>
</body>
