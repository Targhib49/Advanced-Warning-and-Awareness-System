<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "IBM Plex Sans", system-ui, sans-serif; }
    a { color: #38D39B; } a:hover { color: #6FE3B8; }
  </style>
</helmet>
<div style="width: 480px; height: 320px; background: #0A0C0D; color: #E8EDEF; display: flex; flex-direction: column; overflow: hidden; padding: 22px 26px;">

  <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px;">
    <div style="font-size: 21px; font-weight: 700; letter-spacing: 0.06em;">AWAS</div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #4A565B;">SELF-CHECK</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 11px; flex-grow: 1;">

    <div style="display: flex; align-items: center; gap: 11px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#38D39B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
      <div style="font-size: 15px; flex-grow: 1;">Driver camera</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #7C8A91;">30 fps</div>
    </div>

    <div style="display: flex; align-items: center; gap: 11px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#38D39B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
      <div style="font-size: 15px; flex-grow: 1;">IR illuminator</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #7C8A91;">night ready</div>
    </div>

    <div style="display: flex; align-items: center; gap: 11px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#38D39B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
      <div style="font-size: 15px; flex-grow: 1;">GPS</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #7C8A91;">9 sats</div>
    </div>

    <div style="display: flex; align-items: center; gap: 11px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#E0A93C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <div style="font-size: 15px; flex-grow: 1; color: #E0A93C;">OBD-II</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #E0A93C;">not found</div>
    </div>

    <div style="display: flex; align-items: center; gap: 11px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#38D39B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
      <div style="font-size: 15px; flex-grow: 1;">Audio out</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #7C8A91;">184 ms</div>
    </div>

  </div>

  <div style="background: #14181A; border-left: 3px solid #E0A93C; padding: 11px 14px; font-size: 13px; line-height: 1.45; color: #7C8A91;">
    No OBD-II on this vehicle. Speed from GPS instead &mdash; monitoring is unaffected.
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":480,"height":320}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
